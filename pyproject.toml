[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pi05-plug-demo"
version = "0.1.0"
description = "Isolated Panda/Robotiq/GELLO/Kinect/D405 demonstration pipeline"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "h5py>=3.8", "Pillow>=9"]

[project.scripts]
pi05-demo-collect = "pi05_demo.collect:main"
pi05-demo-export = "pi05_demo.export:main"
pi05-demo-review = "pi05_demo.review:main"
pi05-demo-preflight = "pi05_demo.preflight:main"

[tool.setuptools.packages.find]
include = ["pi05_demo*"]
